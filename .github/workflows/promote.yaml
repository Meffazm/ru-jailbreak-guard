name: auto-promote

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install deps
        run: uv sync --frozen --group flyte

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run auto_promote
        env:
          # MLFLOW_TRACKING_URI: repo var pointing at an externally reachable
          # MLflow URL. Unset → script no-ops cleanly.
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/auto_promote.py
