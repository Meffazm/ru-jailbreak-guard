# Tunable knobs for the data pipeline.

seed: 42

dmtrdr:
  revision: null  # null = HF latest; set to a SHA for reproducibility

benign:
  # Smoke-test default. Bump back to 22000 once the merge MinHash dedup is
  # tuned for ~300K-row inputs (currently O(N) per insertion is too slow).
  n_samples: 1000

hivetracered:
  # Space-separated for CLI (nargs="+"); DVC cannot interpolate YAML lists.
  # Keep to one category for the smoke run; merge dedup is the bottleneck.
  categories: "roleplay"

merge:
  target_ratio: 0.5
  jaccard_threshold: 0.85

split:
  # Space-separated for CLI (nargs=3); DVC cannot interpolate YAML lists.
  ratios: "0.7 0.15 0.15"

mlflow:
  tracking_uri: "http://localhost:5000"  # default for local port-forwarded MLflow
  experiment_tfidf: "tfidf_logreg"
  experiment_lgbm: "lgbm_embeddings"

model_tfidf:
  max_features: 50000
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  C: 1.0
  max_iter: 1000

model_lgbm:
  num_leaves: 31
  max_depth: 6
  learning_rate: 0.05
  n_estimators: 200
  min_child_samples: 5

embedding:
  model_name: "cointegrated/rubert-tiny2"
  revision: null
  cache_dir: "data/embeddings_cache"
  max_length: 256
  device: "cpu"
