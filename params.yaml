# Tunable knobs for the data pipeline.

seed: 42

dmtrdr:
  revision: null  # null = HF latest; set to a SHA for reproducibility

benign:
  n_samples: 22000

hivetracered:
  # Space-separated for CLI (nargs="+"); DVC cannot interpolate YAML lists.
  categories: "roleplay persuasion token_smuggling simple_instructions"

merge:
  target_ratio: 0.5
  jaccard_threshold: 0.85

split:
  # Space-separated for CLI (nargs=3); DVC cannot interpolate YAML lists.
  ratios: "0.7 0.15 0.15"
