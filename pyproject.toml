[project]
name = "ru-jailbreak-guard"
version = "0.1.0"
description = "Russian-language jailbreak detection service"
authors = [
    {name = "Dmitrii Velibekov", email = "meridict@gmail.com"},
]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/Meffazm/ru-jailbreak-guard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ru_jailbreak_guard"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
