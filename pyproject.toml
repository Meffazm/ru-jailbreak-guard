[project]
name = "ru-jailbreak-guard"
version = "0.1.0"
description = "Russian-language jailbreak detection service"
authors = [
    {name = "Dmitrii Velibekov", email = "meridict@gmail.com"},
]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "polars==1.40.1",
    "pyarrow==23.0.1",
    "datasets==4.8.5",
    "huggingface_hub==1.13.0",
    "datasketch==1.10.0",
    "dvc[s3]==3.67.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "lightgbm==4.6.0",
    "transformers==5.7.0",
    "torch==2.11.0",
    "accelerate==1.13.0",
    "joblib==1.5.3",
    "matplotlib==3.10.0",
    "mlflow==3.11.1",
    "boto3==1.42.97",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.36.0",
    "pydantic==2.13.3",
    "streamlit==1.57.0",
    "httpx==0.28.1",
    "prometheus-client==0.25.0",
]

[project.urls]
Repository = "https://github.com/Meffazm/ru-jailbreak-guard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ru_jailbreak_guard"]

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "ty==0.0.32",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.1",
    "pandas>=2.3.3",
]
flyte = [
    "flytekit==1.16.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not slow'"
markers = ["slow: marks tests that download or run real models"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
