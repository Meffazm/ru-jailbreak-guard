[project]
name = "ru-jailbreak-guard"
version = "0.1.0"
description = "Russian-language jailbreak detection service"
authors = [
    {name = "Dmitrii Velibekov", email = "meridict@gmail.com"},
]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "polars==1.40.1",
    "pyarrow==19.0.0",
    "datasets==3.6.0",
    "huggingface_hub==0.24.0",
    "datasketch==1.10.0",
    "dvc[s3]==3.67.1",
    # Phase 2 — modeling
    "scikit-learn==1.7.2",
    "lightgbm==4.6.0",
    "transformers==4.48.2",
    "torch==2.6.0",
    "joblib==1.5.2",
    "matplotlib==3.10.0",
    # Phase 2 — MLflow client + serving
    "mlflow==2.20.4",
    "boto3==1.39.5",
    "fastapi==0.118.0",
    "uvicorn[standard]==0.36.0",
    "pydantic==2.10.5",
]

[project.urls]
Repository = "https://github.com/Meffazm/ru-jailbreak-guard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ru_jailbreak_guard"]

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "ty==0.0.32",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
