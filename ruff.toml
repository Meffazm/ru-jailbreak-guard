line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["notebooks", ".venv"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles
]

[lint.per-file-ignores]
"tests/**/*.py" = ["B011", "S101"]  # asserts allowed in tests

[lint.isort]
known-first-party = ["ru_jailbreak_guard"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
