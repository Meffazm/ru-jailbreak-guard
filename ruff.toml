line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["notebooks", ".venv"]

[lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "C901",    # mccabe complexity
    "SIM",     # flake8-simplify
    "TID",     # flake8-tidy-imports
    "RUF",     # ruff-specific
    "PLR0913", # pylint too-many-arguments
]
ignore = [
    "E501",  # line too long - formatter handles
]

[lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # bool comparison via assert allowed in tests

[lint.isort]
known-first-party = ["ru_jailbreak_guard"]

[lint.mccabe]
max-complexity = 8

[lint.pylint]
max-args = 5

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
