# Prometheus Pushgateway — receives push_to_gateway() calls from the drift
# Flyte workflow. Prometheus (in monitoring ns) scrapes it via the
# ServiceMonitor below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: pushgateway }
  template:
    metadata:
      labels: { app: pushgateway }
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.2
          imagePullPolicy: IfNotPresent
          args:
            - --persistence.file=/data/persist
            - --persistence.interval=5m
          ports:
            - containerPort: 9091
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /-/ready, port: 9091 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9091 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: pushgateway
  labels:
    app: pushgateway
spec:
  selector: { app: pushgateway }
  ports:
    - port: 9091
      targetPort: 9091
      name: http
---
# Tell Prometheus to scrape this Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  namespace: pushgateway
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [pushgateway]
  selector:
    matchLabels:
      app: pushgateway
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      honorLabels: true  # Preserve labels pushed by drift workflow
