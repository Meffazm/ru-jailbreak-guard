# One-shot Job: create flyte-meta + splits buckets in MinIO.
# Idempotent: mc mb --ignore-existing.
apiVersion: batch/v1
kind: Job
metadata:
  name: flyte-bucket-init
  namespace: flyte
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mc alias set minio http://minio.minio.svc.cluster.local:9000 minioadmin minioadmin
              mc mb --ignore-existing minio/flyte-meta
              mc mb --ignore-existing minio/splits
              mc ls minio/
