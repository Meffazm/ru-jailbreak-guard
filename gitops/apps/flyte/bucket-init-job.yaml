# One-shot Job: create all MinIO buckets the stack needs.
# Idempotent: mc mb --ignore-existing.
apiVersion: batch/v1
kind: Job
metadata:
  name: flyte-bucket-init
  namespace: flyte
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              # MinIO may not be ready when this PostSync hook fires (alphabetical
              # app sync ordering: flyte before minio on a fresh bootstrap).
              until mc alias set minio http://minio.minio.svc.cluster.local:9000 minioadmin minioadmin 2>/dev/null; do
                echo "Waiting for MinIO..."
                sleep 3
              done
              mc mb --ignore-existing minio/flyte-meta minio/splits minio/predictions
              mc ls minio/
