# One ServiceMonitor per predictor namespace.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ru-jailbreak-tfidf
  namespace: model-tfidf
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [model-tfidf]
  selector:
    matchLabels:
      component: predictor
  endpoints:
    # Predictor service port is unnamed; reference targetPort by number.
    - targetPort: 8080
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
