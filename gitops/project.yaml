apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ru-jailbreak-guard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: ru-jailbreak-guard project (final OTUS MLOps project)
  sourceRepos:
    - https://github.com/Meffazm/ru-jailbreak-guard
    - https://github.com/Meffazm/ru-jailbreak-guard.git
    # Phase 2 — Helm chart repos for infra apps
    - https://charts.jetstack.io
    - https://community-charts.github.io/helm-charts
    - oci://registry-1.docker.io/bitnamicharts
    - ghcr.io/kserve/charts
    - oci://ghcr.io/kserve/charts
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
